name: CYDaux actual USB target endpoint
on:
  workflow_dispatch:
    inputs:
      cydaux_ref:
        description: Exact FM-1-CYDaux companion platform source SHA
        required: true
        type: string
  pull_request:
    paths:
      - 'platform/companion/**'
      - '.github/workflows/cydaux-endpoint.yml'
permissions:
  contents: read
jobs:
  target-usb:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CYDAUX_REF: ${{ inputs.cydaux_ref || 'bd59d3fc7083b48954a48f50a7f964f781e61ba8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Independent C/C++ contract and actual pi32v2 USB emulator qualification
        run: bash platform/companion/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cydaux-usb-target-evidence
          if-no-files-found: warn
          path: companion-results/
          retention-days: 30
  target-grimoire:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VIBEWARE_USB_INSTRUMENT: grimoire
      CYDAUX_REF: bd59d3fc7083b48954a48f50a7f964f781e61ba8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Grimoire host, common codec, actual target, both USB clock models and TCP bridge
        run: bash platform/companion/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cydaux-grimoire-usb-target-evidence
          path: companion-results/
          if-no-files-found: warn
          retention-days: 30
