name: CYDaux actual USB target endpoint
on:
  workflow_dispatch:
    inputs:
      cydaux_ref:
        description: Exact FM-1-CYDaux companion platform source SHA
        required: true
        type: string
  pull_request:
    paths:
      - 'platform/companion/**'
      - '.github/workflows/cydaux-endpoint.yml'
permissions:
  contents: read
jobs:
  target-usb:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CYDAUX_REF: ${{ inputs.cydaux_ref || '5c3d7960ee76132cca95c92394010403f8bd638f' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Independent C/C++ contract and actual pi32v2 USB emulator qualification
        run: bash platform/companion/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cydaux-usb-target-evidence
          if-no-files-found: warn
          path: companion-results/
          retention-days: 30
