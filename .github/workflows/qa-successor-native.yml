            memory: 15248508025
            memory_digest: 2230a8b6268174cf54b976fed2d6ebaf79463f829f9f2dbdf5f78c6a584d8edb
          - instrument: grimoire
            ref: 55eb1bc8f4c99268dc4102fd03f9685bde932fd9
