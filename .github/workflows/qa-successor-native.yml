name: QA successor native archives and replay alignment
on:
  pull_request:
    paths: ['.github/workflows/qa-successor-native.yml','qualification/successor_scores.py','qualification/verify_replay.py','qualification/verify_patch_gallery.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  successor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - instrument: ecophon
            ref: 6c9a6b2fab84a6bfe12d80feff365235901cec3a
            os: ubuntu-24.04
            artifact: 15239703761
            digest: fa333db4eb89de1d13b98609887aa8c6155c5115c76158c99e9b51efe098b59e
            score: 0
            score_digest: none
            gallery: 0
            gallery_digest: none
          - instrument: ecophon
            ref: 6c9a6b2fab84a6bfe12d80feff365235901cec3a
            os: windows-latest
            artifact: 15240071594
            digest: 7b1da307dd8c5d575a752aef7ced1582e21f7fa39f890e2fc48fc36461e46a23
            score: 0
            score_digest: none
            gallery: 0
            gallery_digest: none
          - instrument: grimoire
            ref: efcb924537eee3709d1954d02eff12c1c7e9df2f
            os: ubuntu-24.04
            artifact: 15240153215
            digest: 302440c23b53cb77f10db5bbadb934b8a676e56444bc0c3e87a04f52541e9fbe
            score: 15239953845
            score_digest: 2d864991baa26c1701d1d70e475554bd77824cf2178e415e5b45a96ebd80d8fa
            gallery: 0
            gallery_digest: none
          - instrument: grimoire
            ref: efcb924537eee3709d1954d02eff12c1c7e9df2f
            os: windows-latest
            artifact: 15240398166
            digest: 3d22376237df961a41b8b292cabd14aafd397de9d0e02341f6108656bc75e4d4
            score: 15240632448
            score_digest: 6b55712c804eb3094a14459b1cab71a59f51014c1ffca7d1c47fc01677fcc260
            gallery: 0
            gallery_digest: none
          - instrument: xenoresonator
            ref: 87679d738d4a104a6ba62d53434736eebd19c603
            os: ubuntu-24.04
            artifact: 15239880292
            digest: ec66038f4cca5839c2f5ca2f843ba7cb78a1cb57084aafa9b5b85234601e4647
            score: 15238764872
            score_digest: 8880e5d60ae64cf89600dd5dd52f237eadf32838906bfb7daba1cb04313c1867
            gallery: 15238919305
            gallery_digest: 5454d732c6a2cd169ec9b626b3c678518202ad3840f0803069d0f944f094c6fa
          - instrument: xenoresonator
            ref: 87679d738d4a104a6ba62d53434736eebd19c603
            os: windows-latest
            artifact: 15239298001
            digest: 0def589e5cbeeef84804a3f53f734fdfe68581014f46f56940d09837428ddae1
            score: 15239462424
            score_digest: 7bb6079d75e360ab7c793fdb3b9038d8e6d2c5a40442f2f3ead5fd0fc6b2e41c
            gallery: 15239237817
            gallery_digest: 27b6d0f2122ad155fa0395185ef77cf243b551285edc064d08f74f3b7c607e9c
          - instrument: chronomorph
            ref: f40de42e0973f6697e6d1f19c05ed3565dcbe09e
            os: ubuntu-24.04
            artifact: 15240150437
            digest: 31c6dc310677d662c40c27f465de290abe14eb0ce4add5198ecdeb8de41e6f51
            score: 15240110618
            score_digest: 3f4bef824f11692bbd82bc956081f8de487c1a3b4b27811a1ce52061ada8a1cc
            gallery: 0
            gallery_digest: none
          - instrument: chronomorph
            ref: f40de42e0973f6697e6d1f19c05ed3565dcbe09e
            os: windows-latest
            artifact: 15239418502
            digest: 7d70778ead11f29d4403f74f8c4012c437b8a4b3191797d6849e021a90b9c9fc
            score: 15239134371
            score_digest: e036246e195906832a2a0ececa9d519525b82a69736aaab5cb49ebc5907e96d2
            gallery: 0
            gallery_digest: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original archive and independent native rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          DIGEST: ${{ matrix.digest }}
          PIN: ${{ matrix.ref }}
          INSTRUMENT: ${{ matrix.instrument }}
          SCORE: ${{ matrix.score }}
          SCORE_DIGEST: ${{ matrix.score_digest }}
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = "$PIN"
          mkdir -p receipts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > native.zip
          if [ "$SCORE" != 0 ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SCORE/zip" > score.zip
          fi
          if [ "$INSTRUMENT" = ecophon ]; then
            python qualification/ecophon_archive.py frozen native.zip "$DIGEST" --successor | tee receipts/native.log
          elif [ "$INSTRUMENT" = grimoire ]; then
            python qualification/grimoire_archive.py frozen native.zip "$DIGEST" | tee receipts/native.log
          else
            python qualification/native_archive.py "$INSTRUMENT" frozen native.zip "$DIGEST" | tee receipts/native.log
          fi
          tail -n 1 receipts/native.log > receipts/native.json
          python qualification/successor_scores.py "$INSTRUMENT" frozen native.zip "$DIGEST" score.zip "$SCORE_DIGEST" | tee receipts/score.log
          tail -n 1 receipts/score.log > receipts/score.json
          python -c "import json; [json.load(open('receipts/'+n+'.json')) for n in ('native','score')]"
          git -C frozen rev-parse HEAD > receipts/source.txt
          gcc --version > receipts/compiler.txt
      - name: Independent factory-patch gallery replay and PCM inspection
        if: matrix.instrument == 'xenoresonator'
        env:
          GH_TOKEN: ${{ github.token }}
          GALLERY: ${{ matrix.gallery }}
          DIGEST: ${{ matrix.gallery_digest }}
          PIN: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$GALLERY/zip" > gallery.zip
          mkdir -p 'gallery original' 'gallery fresh'
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'qualification'); from ecophon_archive import extract; extract(Path('gallery.zip'),Path('gallery original'),sys.argv[1])" "$DIGEST"
          test "$(tr -d '\r\n' < 'gallery original/SOURCE-REVISION.txt')" = "$PIN"
          flags=(-std=c11 -O2 -Wall -Wextra -Werror -shared)
          if [ "$RUNNER_OS" = Windows ]; then flags+=(-Wl,--export-all-symbols); else flags+=(-fPIC -fsanitize=undefined -fno-sanitize-recover=all); fi
          gcc "${flags[@]}" frozen/instruments/xenoresonator/xeno.c frozen/instruments/xenoresonator/live_bridge.c -o 'gallery fresh/core.dll'
          python frozen/instruments/xenoresonator/patch_gallery.py 'gallery fresh/core.dll' 'gallery fresh'
          python qualification/verify_patch_gallery.py 'gallery original' > receipts/gallery.json
          python qualification/verify_patch_gallery.py 'gallery fresh'
          python -c "from pathlib import Path; a=Path('gallery original'); b=Path('gallery fresh'); files=sorted(a.glob('*.wav'))+[a/'receipt.json']; assert len(files)==9; assert all(p.read_bytes()==(b/p.name).read_bytes() for p in files)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-successor-${{ matrix.instrument }}-${{ matrix.os }}
          path: receipts/
          if-no-files-found: error
