name: QA successor native archives and replay alignment
on:
  pull_request:
    paths: ['.github/workflows/qa-successor-native.yml','qualification/successor_scores.py','qualification/verify_replay.py','qualification/verify_patch_gallery.py','qualification/verify_lattice.py','qualification/verify_live_replays.py','qualification/verify_material_replay.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  successor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - instrument: ecophon
            ref: c886271d838963aa5a4ff27ab2a934522cf178b7
            os: ubuntu-24.04
            artifact: 15246736976
            digest: 5f2b13de0292203dc30e30a2de30dce386c9106b967006e5553451472b44f1f7
            score: 0
            score_digest: none
            gallery: 0
            gallery_digest: none
            lattice: 0
            lattice_digest: none
            sketch: 0
            sketch_digest: none
          - instrument: ecophon
            ref: c886271d838963aa5a4ff27ab2a934522cf178b7
            os: windows-latest
            artifact: 15245883800
            digest: a5a3e78a09c116201e0c8b9f5a381e8f169de768e8cc6abd89ac507061b68fba
            score: 0
            score_digest: none
            gallery: 0
            gallery_digest: none
            lattice: 0
            lattice_digest: none
            sketch: 0
            sketch_digest: none
          - instrument: grimoire
            ref: 7cc0999c5fe7a110dd9988636ea573a282170e8a
            os: ubuntu-24.04
            artifact: 15246787470
            digest: 016eca2c9d38827e858653b4c157cd64a379000db12efdbe497a15a2cc913d7c
            score: 15246697898
            score_digest: de98a77b43b32d8ae37975899065711218b79a8351590b0d73ca1305daf55d8d
            gallery: 0
            gallery_digest: none
            lattice: 0
            lattice_digest: none
            sketch: 15246414977
            sketch_digest: 4c78bc0e84d7ecbcf38c18a6b512419b5ddbb35c0a4d7b01f04b8590abed44de
          - instrument: grimoire
            ref: 7cc0999c5fe7a110dd9988636ea573a282170e8a
            os: windows-latest
            artifact: 15245854227
            digest: 3d9b56c57aa1a4bc3378d287baf11570208b2b5c85855a28d44ed029defe5adb
            score: 15246128801
            score_digest: 8ce4937132effb5d9bb74091179d44efb4187e14c9398b83924eb28e67982f56
            gallery: 0
            gallery_digest: none
            lattice: 0
            lattice_digest: none
            sketch: 15245954149
            sketch_digest: af480c6104f9a934bdad8ddbbb9f8737433c6beec244736365bae7da72257389
          - instrument: xenoresonator
            ref: 571da84e6fd7d47efb6341cf836ede6367ad4fc8
            os: ubuntu-24.04
            artifact: 15246195925
            digest: 7327a13afd52c770e38ec30558a39677abcf2ca322c14f9a45e67c857da312e8
            score: 15246560108
            score_digest: 9941f392d2b7246b9285e73b55a45373e66368bca78a7572c83a9009c1d64ad3
            material: 15245906757
            material_digest: a21a206467b668722fb5c4d69b51ef35bdf0c0bbfd79e664012975d0182d8f39
            gallery: 15245781905
            gallery_digest: 6e0ac113bdb6732d070b79dbf4ac993d49cdbd5e20b046244931b8b4f7dda6f1
            lattice: 0
            lattice_digest: none
            sketch: 0
            sketch_digest: none
          - instrument: xenoresonator
            ref: 571da84e6fd7d47efb6341cf836ede6367ad4fc8
            os: windows-latest
            artifact: 15246065654
            digest: c2357be924e5e6070c587976e9e9a2edcd03b978e62264f1f37a90ec543e8256
            score: 15246115572
            score_digest: 1decce6c2ca7f8d8468142c8c0d673fbba364d69eb72659a66b478fafe27d8da
            material: 15245935863
            material_digest: 407aa41d99e5c7e7885256745223b00ad47cb6bc0bc26f2e3322a2c62176060c
            gallery: 15245915926
            gallery_digest: 401887070dbbf3bb4f599c327d9adfe44327eb996fa91e0ce4ea05fe7f357669
            lattice: 0
            lattice_digest: none
            sketch: 0
            sketch_digest: none
          - instrument: chronomorph
            ref: 9bf0a771f51214b385439333b77b3aef07f0b695
            os: ubuntu-24.04
            artifact: 15246587409
            digest: bc5d4bd841a293d37690e3bfd1ab426c4de71312be2c559475a980cb9912bb0b
            score: 15246607274
            score_digest: 02f0c4b6f0244e0d36a45682742c76d9b263cc9f53cc85e554647e63abf851e9
            gallery: 0
            gallery_digest: none
            lattice: 15245909253
            lattice_digest: 897da18aded390c67b95c5dc6b5beb3ddd6a2195132b0720007fb8396f0af80d
            sketch: 0
            sketch_digest: none
          - instrument: chronomorph
            ref: 9bf0a771f51214b385439333b77b3aef07f0b695
            os: windows-latest
            artifact: 15245643627
            digest: 673e7559b2ca809af09a83cfcef13f41118bcb0ae719f9316e955d11eed87550
            score: 15245578648
            score_digest: f0b456440dffa2ab20a663958fa967afb9542256103f4cc91fdeb0b15e05b542
            gallery: 0
            gallery_digest: none
            lattice: 15246341949
            lattice_digest: bdf267530429e40e9c6d4444d851f0749d33a312a08bc0169d06eff12326982f
            sketch: 0
            sketch_digest: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original archive and independent native rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          DIGEST: ${{ matrix.digest }}
          PIN: ${{ matrix.ref }}
          INSTRUMENT: ${{ matrix.instrument }}
          SCORE: ${{ matrix.score }}
          SCORE_DIGEST: ${{ matrix.score_digest }}
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = "$PIN"
          mkdir -p receipts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > native.zip
          if [ "$SCORE" != 0 ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SCORE/zip" > score.zip
          fi
          if [ "$INSTRUMENT" = ecophon ]; then
            python qualification/ecophon_archive.py frozen native.zip "$DIGEST" --successor --live-arc | tee receipts/native.log
          elif [ "$INSTRUMENT" = grimoire ]; then
            python qualification/grimoire_archive.py frozen native.zip "$DIGEST" | tee receipts/native.log
          else
            python qualification/native_archive.py "$INSTRUMENT" frozen native.zip "$DIGEST" | tee receipts/native.log
          fi
          tail -n 1 receipts/native.log > receipts/native.json
          extra=()
          if [ "$INSTRUMENT" = ecophon ]; then extra+=(--live-arc); fi
          python qualification/successor_scores.py "$INSTRUMENT" frozen native.zip "$DIGEST" score.zip "$SCORE_DIGEST" "${extra[@]}" | tee receipts/score.log
          tail -n 1 receipts/score.log > receipts/score.json
          python -c "import json; [json.load(open('receipts/'+n+'.json')) for n in ('native','score')]"
          git -C frozen rev-parse HEAD > receipts/source.txt
          gcc --version > receipts/compiler.txt
      - name: Independent factory-patch gallery replay and PCM inspection
        if: matrix.instrument == 'xenoresonator'
        env:
          GH_TOKEN: ${{ github.token }}
          GALLERY: ${{ matrix.gallery }}
          DIGEST: ${{ matrix.gallery_digest }}
          PIN: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$GALLERY/zip" > gallery.zip
          mkdir -p 'gallery original' 'gallery fresh'
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'qualification'); from ecophon_archive import extract; extract(Path('gallery.zip'),Path('gallery original'),sys.argv[1])" "$DIGEST"
          test "$(tr -d '\r\n' < 'gallery original/SOURCE-REVISION.txt')" = "$PIN"
          flags=(-std=c11 -O2 -Wall -Wextra -Werror -shared)
          if [ "$RUNNER_OS" = Windows ]; then flags+=(-Wl,--export-all-symbols); else flags+=(-fPIC -fsanitize=undefined -fno-sanitize-recover=all); fi
          gcc "${flags[@]}" frozen/instruments/xenoresonator/xeno.c frozen/instruments/xenoresonator/live_bridge.c -o 'gallery fresh/core.dll'
          python frozen/instruments/xenoresonator/patch_gallery.py 'gallery fresh/core.dll' 'gallery fresh'
          python qualification/verify_patch_gallery.py 'gallery original' > receipts/gallery.json
          python qualification/verify_patch_gallery.py 'gallery fresh'
          python -c "from pathlib import Path; a=Path('gallery original'); b=Path('gallery fresh'); files=sorted(a.glob('*.wav'))+[a/'receipt.json']; assert len(files)==9; assert all(p.read_bytes()==(b/p.name).read_bytes() for p in files)"
      - name: Independently rebuild and validate Lattice Variations
        if: matrix.instrument == 'chronomorph'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.lattice }}
          DIGEST: ${{ matrix.lattice_digest }}
          PIN: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > lattice.zip
          mkdir -p 'lattice original' 'lattice fresh'
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'qualification'); from ecophon_archive import extract; extract(Path('lattice.zip'),Path('lattice original'),sys.argv[1])" "$DIGEST"
          test "$(tr -d '\r\n' < 'lattice original/source-revision.txt')" = "$PIN"
          flags=(-std=c11 -O2 -Wall -Wextra -Werror -shared)
          if [ "$RUNNER_OS" = Windows ]; then flags+=(-Wl,--export-all-symbols); else flags+=(-fPIC -fsanitize=undefined -fno-sanitize-recover=all); fi
          gcc "${flags[@]}" frozen/instruments/chronomorph/chrono.c frozen/instruments/chronomorph/live_bridge.c -o 'lattice fresh/core.dll'
          python frozen/instruments/chronomorph/lattice_variations.py 'lattice fresh/core.dll' 'lattice fresh'
          python qualification/verify_lattice.py 'lattice original' 'lattice fresh' > receipts/lattice.json
      - name: Independently rebuild live Arc and sketch replay
        if: matrix.instrument == 'ecophon' || matrix.instrument == 'grimoire'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTRUMENT: ${{ matrix.instrument }}
          SKETCH: ${{ matrix.sketch }}
          SKETCH_DIGEST: ${{ matrix.sketch_digest }}
        run: |
          set -euo pipefail
          mkdir -p 'fresh live replay'
          flags=(-std=c11 -O2 -Wall -Wextra -Werror -shared)
          if [ "$RUNNER_OS" = Windows ]; then flags+=(-Wl,--export-all-symbols); else flags+=(-fPIC -fsanitize=undefined -fno-sanitize-recover=all); fi
          if [ "$INSTRUMENT" = ecophon ]; then
            gcc "${flags[@]}" frozen/instruments/ecophon/ecophon.c frozen/instruments/ecophon/fixture.c -o 'fresh core.dll'
            python frozen/instruments/ecophon/live_arc_fixture.py 'fresh core.dll' 'fresh live replay'
            python qualification/verify_live_replays.py ecophon native.zip 'fresh live replay' > receipts/live-replay.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SKETCH/zip" > sketch.zip
            python -c "import hashlib,sys; from pathlib import Path; assert hashlib.sha256(Path('sketch.zip').read_bytes()).hexdigest()==sys.argv[1]" "$SKETCH_DIGEST"
            node --version
            gcc "${flags[@]}" frozen/instruments/grimoire/orbit.c frozen/companion/grimoire/session.c -o 'fresh core.dll'
            python frozen/companion/grimoire/sketch_replay.py 'fresh core.dll' 'fresh live replay'
            python qualification/verify_live_replays.py grimoire sketch.zip 'fresh live replay' > receipts/live-replay.json
          fi
      - name: Independently rebuild and validate held user-material recall
        if: matrix.instrument == 'xenoresonator'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.material }}
          DIGEST: ${{ matrix.material_digest }}
          PIN: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > material.zip
          mkdir -p 'material original' 'material fresh'
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'qualification'); from ecophon_archive import extract; extract(Path('material.zip'),Path('material original'),sys.argv[1])" "$DIGEST"
          test "$(tr -d '\r\n' < 'material original/SOURCE-REVISION.txt')" = "$PIN"
          cmp 'material original/user_material_replay.py' frozen/instruments/xenoresonator/user_material_replay.py
          flags=(-std=c11 -O2 -Wall -Wextra -Werror -shared)
          if [ "$RUNNER_OS" = Windows ]; then flags+=(-Wl,--export-all-symbols); else flags+=(-fPIC -fsanitize=undefined -fno-sanitize-recover=all); fi
          gcc "${flags[@]}" frozen/instruments/xenoresonator/xeno.c frozen/instruments/xenoresonator/live_bridge.c -o 'material fresh/core.dll'
          python frozen/instruments/xenoresonator/user_material_replay.py 'material fresh/core.dll' 'material fresh'
          python qualification/verify_material_replay.py 'material original' 'material fresh' > receipts/material.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-successor-${{ matrix.instrument }}-${{ matrix.os }}
          path: receipts/
          if-no-files-found: error
