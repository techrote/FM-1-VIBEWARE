            artifact: 15249485057
            digest: 6489362ce7c9be2b28f9b2df55f5d01f34a95baa0d328da1f84ba7e542ea043b
            score: 15249390505
            score_digest: 31c22d2ec44b41b1e2f2970f3e68321fca6616c746115ab71dd09078e95ec187
            gallery: 0
            gallery_digest: none
            lattice: 0
            lattice_digest: none
            sketch: 15248479592
            sketch_digest: 21701476ee88f9c8114648c366496adde4635f488d272f4235732f4e55fc8699
          - instrument: grimoire
            ref: 55eb1bc8f4c99268dc4102fd03f9685bde932fd9
            os: windows-latest
            artifact: 15248509378
            digest: 1fc8b0c3f87290e049cd73b7e329c829409005b08565a14378f3601684f68495
            score: 15249231229
            score_digest: 585b841a2585d581a1bc55095b0188311b51af58cefc9fa48a0f9aaf057c7434
            gallery: 0
            gallery_digest: none
            lattice: 0
            lattice_digest: none
            sketch: 15248294810
            sketch_digest: 9ccbc0e4ef46c63ad1efe11d098c1271dcb56cb79007ba5b6127af12e97e0783
          - instrument: xenoresonator
            ref: 18dfda134c401dc9d3fa178c8193ae0983648bb8
            os: ubuntu-24.04
            artifact: 15247912493
            digest: 50b591adfbea97e8729ea8d81b80bdc663f04e5238270a1d23502c41b6982d87
            score: 15247957133
            score_digest: e20e0b5c56ded4fe9a973eba99f34edb7cccadfd1274b0e8e2e9b90a06b8e6dc
            material: 15247094784
            material_digest: 349cbed19ee1cea26e2f394e8956d48530cc225c4f2fb0be7e25242b023c96a2
            gallery: 15247977162
            gallery_digest: dadfc06f1499ce9611d1ad69dffbe76b0f28c5937adc79b7d64bcc5b5fbd6e31
            lattice: 0
            lattice_digest: none
            sketch: 0
            sketch_digest: none
          - instrument: xenoresonator
            ref: 18dfda134c401dc9d3fa178c8193ae0983648bb8
            os: windows-latest
            artifact: 15246969978
            digest: 866f79b5bb37f306d4d4d03345c1cc2abf3a4b83436993c25a90bbf13a75ec84
            score: 15247144622
            score_digest: 620971b59e771b19b9559d945edac835b97650d0114b5a3651d930f3a0d0bbdf
            material: 15247618781
            material_digest: a001754723d27262664f09c549c9ec7a0b59d5ce8c090e1fbfddf56a516ae7c1
            gallery: 15248036063
            gallery_digest: a889686684fa32ab653cee4e60d807c776f9f89c9ca0a5ddfa52b584801a013a
            lattice: 0
