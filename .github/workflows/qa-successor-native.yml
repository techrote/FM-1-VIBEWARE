name: QA successor native archives and replay alignment
on:
  pull_request:
    paths: ['.github/workflows/qa-successor-native.yml','qualification/successor_scores.py','qualification/verify_replay.py','qualification/verify_patch_gallery.py','qualification/verify_lattice.py','qualification/verify_live_replays.py','qualification/verify_material_replay.py','qualification/verify_memory_replay.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  successor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - instrument: ecophon
            ref: 88c6a656c7b3db65b3f8baab57b9f44300bd5ead
            os: ubuntu-24.04
            artifact: 15248318384
            digest: 272dddd1b5d965656dae6e4b67360045d4086eea08ad064d8639767339aa9f9e
            score: 0
            score_digest: none
            gallery: 0
