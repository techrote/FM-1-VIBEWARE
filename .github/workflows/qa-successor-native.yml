name: QA successor native archives and replay alignment
on:
  pull_request:
    paths: ['.github/workflows/qa-successor-native.yml','qualification/successor_scores.py','qualification/verify_replay.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  successor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - instrument: ecophon
            ref: 228784f3df8f3c18701ab484b60cd1a607d511c9
            os: ubuntu-24.04
            artifact: 15237687217
            digest: a465cb9c762f4f2d56bae5cc8252192e5954b8a1f196b1563dc6ea62398b0168
            score: 0
            score_digest: none
          - instrument: ecophon
            ref: 228784f3df8f3c18701ab484b60cd1a607d511c9
            os: windows-latest
            artifact: 15238145831
            digest: ef28aaa1a06f375b5eacb686268dceecfed36974f99b82773f684bd2687952f0
            score: 0
            score_digest: none
          - instrument: grimoire
            ref: 63ecfd1b3ee08988555397bd0673aec91a4cb4e7
            os: ubuntu-24.04
            artifact: 15238851162
            digest: 1a761adbed8f321c1c0135f1c7a0857c4b47488df3fb610558039f7ac1e8c2d9
            score: 15238796164
            score_digest: 94325b23ae332fb4bd3e41166e852c84ffacf8a0f35ef3b83605c7647c25a424
          - instrument: grimoire
            ref: 63ecfd1b3ee08988555397bd0673aec91a4cb4e7
            os: windows-latest
            artifact: 15237793431
            digest: 7c25f0f696645f7442adcc4bc74a2be8901c1463a4a6dcd32c02ef3e5982c3ea
            score: 15237828243
            score_digest: 36bfdd02083aade0dffe817e8507171e07657ca57f6d4323ab38bb0469b7d899
          - instrument: xenoresonator
            ref: 5804ebb694fe9624f5d54edd51f54fad4c2332f8
            os: ubuntu-24.04
            artifact: 15236948633
            digest: 519935591d8cda51ff098e59acf41eb5442a3b0e0bdb0ad0fc90bb3b37a48a11
            score: 15237083456
            score_digest: 24a9ad68e70c1e13bf3703d5617ffef542737517cb40ce189891189458b02357
          - instrument: xenoresonator
            ref: 5804ebb694fe9624f5d54edd51f54fad4c2332f8
            os: windows-latest
            artifact: 15237362337
            digest: 4ddd84de0436ba9b9296bfbbd512a5330a18dafc0052124a666067d72bf2736f
            score: 15237197580
            score_digest: a0952ea3950d3087b6d4201cd8af98fdb4650dcb739d3edabd96c168ab5d64cd
          - instrument: chronomorph
            ref: 7fa9a16b55b321a1a8b46e174ed15e927aeaece6
            os: ubuntu-24.04
            artifact: 15236308947
            digest: 31de5262e932283f28fea086f252c96876dc98173599e1eeb3552ee611199a9f
            score: 15237192841
            score_digest: 35dc71a5b2e0cd2c0b1b620749d62b044ec8340a0da04b3ac73e1da3e015fb0f
          - instrument: chronomorph
            ref: 7fa9a16b55b321a1a8b46e174ed15e927aeaece6
            os: windows-latest
            artifact: 15237532785
            digest: 8dc9349bf5bdd8f8b27e6579fc9227257e4fae72f29302b0cd8fbb11724bf3f3
            score: 15237164344
            score_digest: 355d346a209bc51d7bdd2dd1f92536d55f616b0d2208a326860c48ba4ab500fe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original archive and independent native rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          DIGEST: ${{ matrix.digest }}
          PIN: ${{ matrix.ref }}
          INSTRUMENT: ${{ matrix.instrument }}
          SCORE: ${{ matrix.score }}
          SCORE_DIGEST: ${{ matrix.score_digest }}
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = "$PIN"
          mkdir -p receipts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > native.zip
          if [ "$SCORE" != 0 ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SCORE/zip" > score.zip
          fi
          if [ "$INSTRUMENT" = ecophon ]; then
            python qualification/ecophon_archive.py frozen native.zip "$DIGEST" --successor | tee receipts/native.log
          elif [ "$INSTRUMENT" = grimoire ]; then
            python qualification/grimoire_archive.py frozen native.zip "$DIGEST" | tee receipts/native.log
          else
            python qualification/native_archive.py "$INSTRUMENT" frozen native.zip "$DIGEST" | tee receipts/native.log
          fi
          tail -n 1 receipts/native.log > receipts/native.json
          python qualification/successor_scores.py "$INSTRUMENT" frozen native.zip "$DIGEST" score.zip "$SCORE_DIGEST" | tee receipts/score.log
          tail -n 1 receipts/score.log > receipts/score.json
          python -c "import json; [json.load(open('receipts/'+n+'.json')) for n in ('native','score')]"
          git -C frozen rev-parse HEAD > receipts/source.txt
          gcc --version > receipts/compiler.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-successor-${{ matrix.instrument }}-${{ matrix.os }}
          path: receipts/
          if-no-files-found: error
