            sketch: 0
            sketch_digest: none
            memory: 15248398158
            memory_digest: 5b1c585fa9d5e9bddc8bee8f29ca70bbe99003d48017fa3b5822f7ffc915b44f
          - instrument: ecophon
            ref: 88c6a656c7b3db65b3f8baab57b9f44300bd5ead
            os: windows-latest
            artifact: 15248139294
            digest: ed3d6d98d316012ebfcabe008098bc676978bf7e262552e1337cfeada6cf46e6
            score: 0
            score_digest: none
            gallery: 0
