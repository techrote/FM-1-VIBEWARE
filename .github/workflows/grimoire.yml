name: Grimoire native audition
on:
  pull_request:
    paths: ['instruments/grimoire/**','companion/grimoire/**','.github/workflows/grimoire.yml']
  push:
    branches: ['hybrid/grimoire-001']
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "$EXPECTED_SOURCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run actual core
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then ext=dll; flags=""; else ext=so; flags="-fPIC -fsanitize=undefined -fno-sanitize-recover=all"; fi
          gcc -std=c11 -Wall -Wextra -Werror -O2 $flags instruments/grimoire/orbit.c companion/grimoire/session.c instruments/grimoire/test.c -o out/test
          ./out/test out/amber.wav out/iron.wav out/abyss.wav
          gcc -std=c11 -Wall -Wextra -Werror -O2 $flags instruments/grimoire/orbit.c companion/grimoire/session.c instruments/grimoire/performance.c -o out/performance
          ./out/performance out/orbit-passage.wav
          gcc -std=c11 -Wall -Wextra -Werror -O2 -shared $flags instruments/grimoire/orbit.c companion/grimoire/session.c -o out/orbit.$ext
          python companion/grimoire/replay.py out/orbit.$ext out/orbit-passage.wav out/orbit-replay.json
          python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('out/orbit-replay.json').read_bytes()).hexdigest() == '6793ac69399a826931713f01375803bafceab3ad99c9308774689362761db43a'"
          python companion/grimoire/smoke.py out/orbit.$ext
          python companion/grimoire/test_ribbon_endpoint.py out/orbit.$ext
          python companion/grimoire/test_socket_lifecycle.py out/orbit.$ext
          node companion/grimoire/test_gesture.cjs
          node companion/grimoire/test_visual.cjs
          python -c "import hashlib,pathlib; p=pathlib.Path('out'); [(print(f.name,hashlib.sha256(f.read_bytes()).hexdigest())) for f in sorted(p.glob('*.wav'))]"
          cp companion/grimoire/{host.py,index.html,smoke.py,test_ribbon_endpoint.py,test_socket_lifecycle.py,replay.py,sketch_replay.py,gesture.js,profile.json,test_gesture.cjs,test_visual.cjs,test_browser.py} out/
          python out/smoke.py out/orbit.$ext
          node out/test_gesture.cjs
          node out/test_visual.cjs
      - name: Execute staged package from a path with spaces
        run: |
          mkdir -p "extracted Orbit Gate"
          cp -R out/. "extracted Orbit Gate/"
          cd "extracted Orbit Gate"
          if [ "$RUNNER_OS" = Windows ]; then ext=dll; else ext=so; fi
          python smoke.py "orbit.$ext"
          python test_ribbon_endpoint.py "orbit.$ext"
          python test_socket_lifecycle.py "orbit.$ext"
          node test_gesture.cjs
          node test_visual.cjs
          python sketch_replay.py "orbit.$ext" ../sketch-out
          python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('../sketch-out/sketch-replay.json').read_bytes()).hexdigest() == '5036b49597db15524d29a2c61218774a0ffbf78c04127cd42313c16accb2dc17'"
      - name: Native ribbon actual-core and browser clock parity
        run: |
          if [ "$RUNNER_OS" = Windows ]; then flags=""; else flags="-fsanitize=undefined -fno-sanitize-recover=all"; fi
          gcc -std=c11 -Wall -Wextra -Werror -O2 $flags instruments/grimoire/orbit.c companion/grimoire/session.c companion/grimoire/test_native_ribbon.c -o out/native-ribbon-test
          mkdir -p native-ribbon-out
          ./out/native-ribbon-test > native-ribbon-out/native-ribbon-trace.csv
          node companion/grimoire/test_native_ribbon.cjs native-ribbon-out/native-ribbon-trace.csv
          rm out/native-ribbon-test*
          cp companion/grimoire/{native_ribbon.h,test_native_ribbon.c,test_native_ribbon.cjs} native-ribbon-out/
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-native-ribbon-${{ matrix.os }}
          path: native-ribbon-out/
      - name: Real Chromium playback and fault integration
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python "extracted Orbit Gate/test_browser.py" "extracted Orbit Gate/orbit.so" --screenshot out/orbit-gate.png
      - name: Orbit Ribbon actual-core comparative performance
        run: |
          mkdir -p ribbon-out
          if [ "$RUNNER_OS" = Windows ]; then flags=""; else flags="-fsanitize=undefined -fno-sanitize-recover=all"; fi
          gcc -std=c11 -Wall -Wextra -Werror -O2 $flags instruments/grimoire/orbit.c companion/grimoire/session.c instruments/grimoire/ribbon.c -o out/ribbon-test
          ./out/ribbon-test ribbon-out/ribbon.wav ribbon-out/fixed-y.wav ribbon-out/ribbon.csv
          rm out/ribbon-test*
          python -c "import hashlib,pathlib; p=pathlib.Path('ribbon-out'); expected={'ribbon.wav':'656e0005c1bf3f3938e1e53421eb08388a6277a7ac4459fcb4055be6cd4d8c00','fixed-y.wav':'f177381f4a167347d7c6f02697bb1a4bfb23b06b77b1b696638e56764459b8f8','ribbon.csv':'1330ce29c3fb722095acdf3af217032b2d1beb3473e4007a2414b46678adafaf'}; assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==h for n,h in expected.items()), 'ribbon hash mismatch'"
          cp instruments/grimoire/ribbon.c ribbon-out/
      - name: Orbit direction actual-core matched comparison
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ext=dll; else ext=so; fi
          python companion/grimoire/direction_replay.py "extracted Orbit Gate/orbit.$ext" direction-out --revision "$EXPECTED_SOURCE"
          cp companion/grimoire/direction_replay.py direction-out/
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-direction-replay-${{ matrix.os }}
          path: direction-out/
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-sketch-replay-${{ matrix.os }}
          path: sketch-out/
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-ribbon-${{ matrix.os }}
          path: ribbon-out/
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-${{ matrix.os }}
          path: out/
      - name: Standalone sample-clock ribbon and matched audio
        run: |
          mkdir -p sample-ribbon-out
          if [ "$RUNNER_OS" = Windows ]; then flags=""; else flags="-fsanitize=undefined -fno-sanitize-recover=all"; fi
          gcc -std=c11 -Wall -Wextra -Werror -O2 $flags instruments/grimoire/orbit.c instruments/grimoire/test_sample_ribbon.c -o out/sample-ribbon-test
          ./out/sample-ribbon-test sample-ribbon-out/forward.wav sample-ribbon-out/reverse.wav
          python -c "import hashlib,pathlib; p=pathlib.Path('sample-ribbon-out'); expected={'forward.wav':'021844388fefda0915ced034c560007a039aa8b8377008b25dc102293aa57f0c','reverse.wav':'952d4b27971636c65079e6a78a344eb0ea2f16926ccefee54c071c25eeb93e3b'}; assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==h for n,h in expected.items())"
          cp instruments/grimoire/{orbit.c,orbit.h,sample_ribbon.h,test_sample_ribbon.c} sample-ribbon-out/
          rm out/sample-ribbon-test*
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-sample-ribbon-${{ matrix.os }}
          path: sample-ribbon-out/
