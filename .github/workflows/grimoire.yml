name: Grimoire native audition
on:
  pull_request:
    paths: ['instruments/grimoire/**','companion/grimoire/**','.github/workflows/grimoire.yml']
  push:
    branches: ['hybrid/grimoire-001']
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run actual core
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then ext=dll; flags=""; else ext=so; flags="-fPIC -fsanitize=undefined -fno-sanitize-recover=all"; fi
          gcc -std=c11 -Wall -Wextra -Werror -O2 $flags instruments/grimoire/orbit.c companion/grimoire/session.c instruments/grimoire/test.c -o out/test
          ./out/test out/amber.wav out/iron.wav out/abyss.wav
          gcc -std=c11 -Wall -Wextra -Werror -O2 $flags instruments/grimoire/orbit.c companion/grimoire/session.c instruments/grimoire/performance.c -o out/performance
          ./out/performance out/orbit-passage.wav
          gcc -std=c11 -Wall -Wextra -Werror -O2 -shared $flags instruments/grimoire/orbit.c companion/grimoire/session.c -o out/orbit.$ext
          python companion/grimoire/smoke.py out/orbit.$ext
          node companion/grimoire/test_gesture.cjs
          node companion/grimoire/test_visual.cjs
          python -c "import hashlib,pathlib; p=pathlib.Path('out'); [(print(f.name,hashlib.sha256(f.read_bytes()).hexdigest())) for f in sorted(p.glob('*.wav'))]"
          cp companion/grimoire/{host.py,index.html,smoke.py,gesture.js,profile.json,test_gesture.cjs,test_visual.cjs,test_browser.py} out/
          python out/smoke.py out/orbit.$ext
          node out/test_gesture.cjs
          node out/test_visual.cjs
      - name: Execute staged package from a path with spaces
        run: |
          mkdir -p "extracted Orbit Gate"
          cp -R out/. "extracted Orbit Gate/"
          cd "extracted Orbit Gate"
          if [ "$RUNNER_OS" = Windows ]; then ext=dll; else ext=so; fi
          python smoke.py "orbit.$ext"
          node test_gesture.cjs
          node test_visual.cjs
      - name: Real Chromium playback and fault integration
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python "extracted Orbit Gate/test_browser.py" "extracted Orbit Gate/orbit.so" --screenshot out/orbit-gate.png
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-${{ matrix.os }}
          path: out/
