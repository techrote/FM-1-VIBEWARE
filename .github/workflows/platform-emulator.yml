name: PLATFORM first virtual target
on:
  pull_request:
    paths:
      - 'platform/emulator/**'
      - '.github/workflows/platform-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-virtual-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build pinned reference, Orbit Gate and Ecophon targets; run strict PCM cases
        run: bash platform/emulator/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-virtual-evidence
          if-no-files-found: warn
          path: platform-results/
          retention-days: 14

  windows-native-virtual:
    needs: linux-virtual-target
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: platform-virtual-evidence
          path: linux-evidence
      - name: Validate Windows runner contract
        run: python platform/emulator/ci_windows.py --test
      - name: Fresh native Windows target builds, headless parity and fm1-live audio benchmarks
        run: python platform/emulator/ci_windows.py linux-evidence windows-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-windows-virtual-evidence
          if-no-files-found: warn
          path: windows-results/
          retention-days: 14
