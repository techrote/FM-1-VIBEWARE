name: Ecophon portable
on:
  pull_request:
    paths:
      - 'instruments/ecophon/**'
      - '.github/workflows/ecophon-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: instruments/ecophon
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror ecophon.c test.c -o test
          ./test
          gcc -std=c11 -O2 -Wall -Wextra -Werror ecophon.c host.c -o ecophon
      - name: Linux UBSan
        if: runner.os == 'Linux'
        run: |
          for cc in gcc clang; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all ecophon.c test.c -o test-san
            ./test-san
          done
      - name: Render and verify exact PCM
        run: |
          mkdir -p audition
          for p in 0 1 2 3; do ./ecophon audition/$p.wav "$p" 42 30; done
          python -c "import hashlib,pathlib; expected=['6971486e4a5736a93cc1dda9ed4dc5675edf79f828de1e14a1fad70f2fc9ac88','e6c974d5988449d7880838223cc11a835ffba764ba67854e46558e2f12618b74','155158bdf0d51a2bed10948d9f1bf226d9f6c57e9b8f272c5c6ddcfb99e8bc7b','73e1093fb5103213af9f3ddccf52bce37ad1fbbb9aa5b3a1375c5c2cbcf3a41f']; actual=[hashlib.sha256(pathlib.Path(f'audition/{p}.wav').read_bytes()).hexdigest() for p in range(4)]; print(actual); assert actual==expected"
          cp ecophon* audition/
          cp README.md audition/
      - uses: actions/upload-artifact@v4
        with:
          name: ecophon-portable-${{ runner.os }}
          path: instruments/ecophon/audition/
