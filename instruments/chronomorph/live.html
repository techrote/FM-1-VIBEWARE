<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chronomorph live</title>
<style>body{font:16px system-ui;background:#141822;color:#e8e6db;max-width:760px;margin:1rem auto;padding:0 1rem}fieldset{border:1px solid #505d70;margin:1rem 0}label{display:inline-block;margin:.45rem}input[type=number]{width:5rem}button,select{padding:.5rem} .steps{display:flex;gap:4px;flex-wrap:wrap}.steps button{background:#293143;color:white;border:1px solid #65748d;min-width:32px}.steps button.on{background:#c69b52;color:#141822}.steps button.current{outline:3px solid #77d5ce}output{display:block;white-space:pre-wrap}</style>
<h1>Chronomorph — live clocks</h1><p>Actual local native engine. Edit patterns and warp while playing. Clock markers are sampled local state, not device telemetry.</p>
<label>Composition <select id="preset"><option>Glass Lattice</option><option>Broken Meridian</option><option>Slow Eclipse</option></select></label>
<label>BPM <input id="bpm" type="number" min="40" max="220"></label><label>Warp <input id="warp" type="number" min="-60" max="60"></label><label>Variation <input id="variation" type="number" min="0" max="100" value="12"></label><label>Seed <input id="seed" type="number" min="1" max="2147483647" value="17"></label>
<div id="lanes"></div><button id="start">Start / resume</button> <button id="pause">Pause</button> <button id="reset">Reset composition</button> <button id="panic">Panic / disconnect</button><output id="status" aria-live="polite">Stopped</output>
<script>
const $=id=>document.getElementById(id), presets=[[112,24,[7,5,11],[73,21,1321]],[142,-32,[5,9,7],[21,297,85]],[84,48,[9,7,13],[293,73,4693]]];
let lens=[],masks=[],token=null,seq=0,gen=0,playEpoch=0,playing=0,ctx=null,next=0,sources=new Set(),visual=[],timer=null,inflight=null;
function clamp(id,lo,hi){const x=Number($(id).value);return Number.isFinite(x)?Math.max(lo,Math.min(hi,Math.round(x))):lo}
function rotatePattern(mask,n,delta){const limit=(1<<n)-1;mask&=limit;return delta>0?((mask<<1)|(mask>>>(n-1)))&limit:((mask>>>1)|((mask&1)<<(n-1)))&limit}
function spreadPattern(n,hits){let mask=0;for(let j=0;j<n;j++)if((j*hits)%n<hits)mask|=1<<j;return mask}
function grid(){ $('lanes').replaceChildren(); ['Bass / master','Bell / elastic','Dust / counterclock'].forEach((name,i)=>{const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=name;f.append(l);const length=document.createElement('input');length.type='number';length.min=1;length.max=16;length.value=lens[i];length.setAttribute('aria-label',name+' cycle length');length.onchange=()=>{lens[i]=Math.max(1,Math.min(16,Math.round(Number(length.value))||1));masks[i]&=(1<<lens[i])-1;grid()};f.append('Steps ',length);
const density=document.createElement('input');density.type='number';density.min=0;density.max=lens[i];density.value=masks[i].toString(2).replace(/0/g,'').length;density.setAttribute('aria-label',name+' hits');
const action=(label,run)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-label',name+' '+label);b.onclick=()=>{run();grid()};return b};
f.append(' Hits ',density,' ',action('Spread hits',()=>{const k=Math.max(0,Math.min(lens[i],Math.round(Number(density.value))||0));masks[i]=spreadPattern(lens[i],k)}),' ',action('Rotate left',()=>{masks[i]=rotatePattern(masks[i],lens[i],-1)}),' ',action('Rotate right',()=>{masks[i]=rotatePattern(masks[i],lens[i],1)}));const row=document.createElement('div');row.className='steps';row.id='lane'+i;for(let j=0;j<lens[i];j++){const b=document.createElement('button');b.textContent=j+1;b.className=(masks[i]>>j)&1?'on':'';b.setAttribute('aria-pressed',String(!!((masks[i]>>j)&1)));b.onclick=()=>{masks[i]^=1<<j;grid()};row.append(b)}f.append(row);$('lanes').append(f)})}
function load(){const p=presets[$('preset').selectedIndex];$('bpm').value=p[0];$('warp').value=p[1];lens=p[2].slice();masks=p[3].slice();grid()}
load();
async function request(path,q,signal){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q),signal});if(!r.ok)throw Error('Session rejected: '+r.status);return r.json()}
function clearAudio(){for(const s of sources){try{s.stop()}catch{}}sources.clear();visual=[];next=ctx?ctx.currentTime:0;for(let i=0;i<3;i++)for(const b of $('lane'+i).children)b.classList.remove('current')}
function disconnect(){gen++;playEpoch++;playing=0;clearTimeout(timer);if(inflight)inflight.abort();inflight=null;clearAudio();const old=token;token=null;if(old)request('/panic',{token:old}).catch(()=>{});$('status').textContent='Stopped / disconnected'}
async function begin(){disconnect();const g=gen;try{if(!ctx)ctx=new AudioContext();await ctx.resume();if(g!==gen)return;const controller=new AbortController();inflight=controller;const r=await request('/session',{version:1,preset:$('preset').selectedIndex,seed:clamp('seed',1,2147483647)},controller.signal);if(g!==gen){request('/panic',{token:r.token}).catch(()=>{});return}inflight=null;token=r.token;seq=0;playing=1;next=ctx.currentTime+.03;pump(g)}catch(e){if(g===gen){disconnect();$('status').textContent=e.message}}}
async function pump(g){if(g!==gen||!token)return;try{
  if(ctx.state!=='running')throw Error('Audio context suspended');
  while(visual.length&&visual[0].time<=ctx.currentTime){const v=visual.shift();v.lanes.forEach((l,i)=>{[...$('lane'+i).children].forEach((b,j)=>b.classList.toggle('current',j===l[0]&&v.playing))});$('status').textContent=(v.playing?'Playing':'Paused')+' | ticks / hits: '+v.lanes.map(l=>l[1]+'/'+l[2]).join(' · ')}
  if(next-ctx.currentTime<.075&&sources.size<3&&visual.length<3){
    const active=playing,epoch=playEpoch,controller=new AbortController();inflight=controller;
    const r=await request('/block',{token,seq:++seq,bpm:clamp('bpm',40,220),warp:clamp('warp',-60,60),variation:clamp('variation',0,100),playing:active,patterns:lens.map((n,i)=>[n,masks[i]])},controller.signal);
    if(g!==gen)return;inflight=null;
    if(r.seq!==seq)throw Error('Sequence mismatch');
    if(epoch===playEpoch&&active===playing){const raw=atob(r.pcm);if(raw.length!==2400)throw Error('PCM size');const b=ctx.createBuffer(1,1200,24000),a=b.getChannelData(0);for(let i=0;i<1200;i++){let v=raw.charCodeAt(2*i)|(raw.charCodeAt(2*i+1)<<8);a[i]=(v>=32768?v-65536:v)/32768}
      const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);const at=Math.max(next,ctx.currentTime+.008);s.onended=()=>sources.delete(s);sources.add(s);s.start(at);next=at+.05;visual.push({time:next,lanes:r.lanes,playing:r.playing})
    }
  }
  timer=setTimeout(()=>pump(g),15)
}catch(e){if(g===gen){disconnect();$('status').textContent=e.message}}}
$('start').onclick=()=>{if(token){if(!playing){playEpoch++;playing=1;clearAudio()}}else begin()};
$('pause').onclick=()=>{if(!token){disconnect();return}playEpoch++;playing=0;clearAudio();$('status').textContent='Paused'};
$('panic').onclick=disconnect;
$('reset').onclick=()=>{disconnect();load();begin()};
$('preset').onchange=()=>{disconnect();load()};
window.addEventListener('pagehide',disconnect);
</script></html>
