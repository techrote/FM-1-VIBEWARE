<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chronomorph</title>
<style>body{font:16px system-ui;background:#141822;color:#e8e6db;max-width:720px;margin:2rem auto;padding:0 1rem}fieldset{border:1px solid #505d70;margin:1rem 0}label{display:inline-block;margin:.45rem}input[type=number]{width:5rem}button,select{padding:.4rem} .steps{display:flex;gap:4px;flex-wrap:wrap}.steps button{background:#293143;color:white;border:1px solid #65748d;min-width:30px}.steps button.on{background:#c69b52;color:#141822}audio{width:100%}output{display:block;white-space:pre-wrap}</style>
<h1>Chronomorph</h1><p>Three elastic clocks. Edit each cycle, then render a new seeded phrase. Preview is native-core audio, not FM-1 or device telemetry.</p>
<label>Composition <select id="preset"><option>Glass Lattice</option><option>Broken Meridian</option><option>Slow Eclipse</option></select></label>
<label>BPM <input id="bpm" type="number" min="40" max="220"></label><label>Warp <input id="warp" type="number" min="-60" max="60"></label><label>Variation % <input id="variation" type="number" min="0" max="100" value="12"></label><label>Seed <input id="seed" type="number" min="1" max="2147483647" value="17"></label><label>Seconds <input id="seconds" type="number" min="1" max="20" value="12"></label>
<div id="lanes"></div><button id="render">Render &amp; play</button> <button id="stop">Stop playback</button><p><audio id="audio" controls></audio></p><output id="status" aria-live="polite"></output>
<script>
const $=id=>document.getElementById(id), presets=[[112,24,[7,5,11],[73,21,1321]],[142,-32,[5,9,7],[21,297,85]],[84,48,[9,7,13],[293,73,4693]]];let lens=[],masks=[],generation=0,blobUrl;
function grid(){ $('lanes').replaceChildren(); ['Bass / master','Bell / elastic','Dust / counterclock'].forEach((name,i)=>{const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=name;f.append(l);const length=document.createElement('input');length.type='number';length.min=1;length.max=16;length.value=lens[i];length.setAttribute('aria-label',name+' cycle length');length.onchange=()=>{lens[i]=Math.max(1,Math.min(16,Number(length.value)||1));masks[i]&=(1<<lens[i])-1;grid()};f.append('Steps ',length);const row=document.createElement('div');row.className='steps';for(let j=0;j<lens[i];j++){const b=document.createElement('button');b.textContent=j+1;b.className=(masks[i]>>j)&1?'on':'';b.setAttribute('aria-pressed',String(!!((masks[i]>>j)&1)));b.onclick=()=>{masks[i]^=1<<j;grid()};row.append(b)}f.append(row);$('lanes').append(f)}) }
function load(){const p=presets[$('preset').selectedIndex];$('bpm').value=p[0];$('warp').value=p[1];lens=p[2].slice();masks=p[3].slice();grid()};$('preset').onchange=load;load();
$('stop').onclick=()=>{generation++;$('audio').pause();$('audio').currentTime=0;$('status').textContent='Stopped';$('render').disabled=false};
$('render').onclick=async()=>{const gen=++generation;$('render').disabled=true;$('audio').pause();$('status').textContent='Rendering…';try{const q=new URLSearchParams({preset:$('preset').selectedIndex});for(const k of ['seed','bpm','warp','variation','seconds'])q.set(k,$(k).value);for(let i=0;i<3;i++){q.set('len'+i,lens[i]);q.set('mask'+i,masks[i])}const r=await fetch('/render?'+q);if(!r.ok)throw Error('Render rejected');const data=await r.blob();if(gen!==generation)return;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(data);$('audio').src=blobUrl;$('status').textContent='Final local clock state (step:ticks:hits): '+r.headers.get('X-Clock-State');await $('audio').play().catch(()=>{})}catch(e){if(gen===generation)$('status').textContent=e.message}finally{if(gen===generation)$('render').disabled=false}};
</script></html>
